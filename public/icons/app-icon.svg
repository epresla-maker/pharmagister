<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bgGradient)"/>
  
  <!-- Main text "Pm" -->
  <text x="256" y="240" font-family="Arial, sans-serif" font-size="280" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">Pm</text>
  
  <!-- Subtitle "vali Friend" in cursive -->
  <text x="256" y="400" font-family="Brush Script MT, Segoe Script, cursive" font-size="80" fill="#0891b2" text-anchor="middle" dominant-baseline="middle" font-style="italic">vali Friend</text>
</svg>
